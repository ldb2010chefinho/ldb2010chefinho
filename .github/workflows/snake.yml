name: cobrinha

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia à meia-noite (horário de Brasília)
  workflow_dispatch:       # botão para rodar na mão
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#2AA344&color_dots=#0E260F,#217C3E,#217C3E,#2AA344,#2AA344
            dist/snake-light.svg?color_snake=#11115C&color_dots=#0E260F,#217C3E,#217C3E,#2AA344,#2AA344

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
